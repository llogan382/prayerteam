name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Real Postgres 18 for the integration tests (#14, #32). Same image as
    # compose.yaml; the tests make their own databases from a template.
    services:
      postgres:
        image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
        env:
          POSTGRES_USER: prayerteam
          POSTGRES_PASSWORD: prayerteam
          POSTGRES_DB: prayerteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prayerteam"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://prayerteam:prayerteam@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install Playwright browsers
        run: pnpm --filter @prayerteam/mobile exec playwright install --with-deps chromium webkit

      - name: Type check, tests against Postgres, drizzle-kit check, cdk synth, web build and end-to-end tests
        run: pnpm run ci

      # `ci` regenerates openapi.json and the client types (typecheck depends
      # on generate); the committed files must match what the routes declare
      # (ADR 0002).
      - name: OpenAPI contract and client types are up to date
        run: git diff --exit-code -- apps/server/openapi.json packages/api-client/src/schema.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/mobile/playwright-report
          retention-days: 7
