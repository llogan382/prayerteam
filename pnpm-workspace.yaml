packages:
  - apps/*
  - packages/*
  - infra

# nodeLinker stays at pnpm's default (isolated). `hoisted` is the documented
# fallback if Expo tooling misbehaves (research doc §5.1).
catalogMode: strict

# Dependency build scripts stay blocked (strictDepBuilds). The first install of the
# Expo SDK 58 app needed none; add a package here only when install reports it.
allowBuilds: {}

catalog:
  turbo: 2.11.13
  typescript: ^7.0.2
  "@playwright/test": 1.65.1
  "@types/node": ^24.0.0
  zod: 4.6.7
  # Expo SDK 58: versions from expo's bundledNativeModules.json
  expo: ~58.0.26
  expo-router: ~58.0.32
  expo-constants: ~58.0.16
  expo-linking: ~58.0.17
  "@expo/metro-runtime": ~58.0.17
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-web: ~0.21.4
  react-native-safe-area-context: ~5.11.1
  react-native-screens: ~4.30.1
  "@types/react": 19.3.0
  # Infrastructure (infra workspace, ADR 0005)
  aws-cdk-lib: 2.278.0
  aws-cdk: 2.1149.0
  constructs: 10.8.1
  vitest: 5.1.2
